<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JoyAI-Video-Edit</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --bg: #f0efe9;
      --panel: #ffffff;
      --panel-2: #faf9f5;
      --line: #e6e4dd;
      --text: #1c1c1c;
      --muted: #8a8a86;
      --accent: #f2643f;
      --accent-2: #d7a64a;
      --media-bg: #0d0d0d;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 16px 28px; }
    .topbar .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
    .topbar .brand { font-size: 18px; font-weight: 760; letter-spacing: .2px; }
    .topbar .tagline { font-size: 13px; color: var(--muted); }
    .lang-seg { margin-left: auto; display: inline-flex; gap: 3px; }
    .lang-seg button { cursor: pointer; font-size: 12px; font-weight: 600; color: #6a6a64; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
    .lang-seg button:hover { border-color: var(--accent); color: var(--accent); }
    .lang-seg button.on { color: #fff; background: var(--accent); border-color: var(--accent); }
    .stage { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 4px 28px 10px; }
    .vpanel { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
    .vpanel-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; }
    .vpanel-head .vp-title { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 720; }
    .vpanel-head .vp-title .ico { font-size: 14px; color: var(--accent); }
    .src-controls { display: inline-flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .media-box { position: relative; flex: 1 1 auto; min-height: 0; margin: 0 12px 12px; overflow: hidden; border-radius: 12px; background: var(--media-bg); }
    .media-box img:not([src]) { visibility: hidden; }
    video, canvas, img { width: 100%; height: 100%; display: block; object-fit: contain; background: var(--media-bg); }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; color: #cfcfca; }
    .overlay .hint { font-size: 13px; color: #9a9a95; max-width: 320px; line-height: 1.5; text-wrap: balance; }
    .overlay .idle-ico { font-size: 30px; color: #6f6f6a; }
    .res-banner { text-align: center; font-size: 14px; font-weight: 700; color: #231900; background: #f5b32b; border-top: 1px solid rgba(0,0,0,.18); border-bottom: 1px solid rgba(0,0,0,.24); padding: 9px 12px; line-height: 1.45; }
    .res-banner .res-ico { margin-right: 6px; font-size: 15px; }
    @keyframes joy-spin { to { transform: rotate(360deg); } }
    .idle-ico.spin { display: inline-block; animation: joy-spin 1.1s linear infinite; }
    .wait-overlay { background: var(--media-bg); z-index: 3; }
    .wait-overlay .idle-ico { font-size: 40px; color: var(--accent); }
    .wait-overlay .hint { font-size: 15px; color: #d9d9d4; font-weight: 600; max-width: 380px; }
    .toast { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
             z-index: 4; padding: 10px 18px; border-radius: 999px; max-width: 80%;
             background: rgba(20,20,22,.66); color: #fff; font-size: 14px; font-weight: 600;
             text-align: center; line-height: 1.4; box-shadow: 0 4px 20px rgba(0,0,0,.4);
             backdrop-filter: blur(2px); pointer-events: none; opacity: 0;
             transition: opacity .25s ease; }
    .toast.show { opacity: 1; }
    .download-bubble { position: absolute; right: 14px; bottom: 14px; z-index: 5; cursor: pointer;
             padding: 9px 16px; border: none; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 700;
             color: #fff; background: var(--accent); box-shadow: 0 4px 18px rgba(242,100,63,.45);
             opacity: 0; transform: translateY(8px); transition: opacity .3s ease, transform .3s ease;
             animation: bubblePulse 2s ease-in-out infinite; }
    .download-bubble.show { opacity: 1; transform: translateY(0); }
    .download-bubble:hover { filter: brightness(1.06); }
    @keyframes bubblePulse { 0%,100% { box-shadow: 0 4px 18px rgba(242,100,63,.45); } 50% { box-shadow: 0 4px 26px rgba(242,100,63,.75); } }
    .start-btn { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 640; color: #fff; background: rgba(40,40,40,.92); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 11px 20px; }
    .start-btn:hover { background: rgba(64,64,64,.95); }
    .crop-mask { position: absolute; display: none; pointer-events: none; border-radius: 8px; outline: 2px solid rgba(255,255,255,.9); outline-offset: -1px; box-shadow: 0 0 0 9999px rgba(0,0,0,.5); z-index: 1; }
    .crop-mask.show { display: block; }
    #camera { transform: scaleX(-1); }
    #camera.no-mirror { transform: none; }
    .cmdbar { position: relative; flex: 0 0 auto; margin: 0 28px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; }
    .cmd-row { display: flex; align-items: center; gap: 12px; }
    .ref-slot { flex: 0 0 auto; position: relative; }
    .ref-add { display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; user-select: none; }
    .ref-add:hover { border-color: var(--muted); color: var(--text); }
    .ref-slot.has-thumb .ref-add { display: none; }
    .ref-thumb { display: none; position: relative; width: 46px; height: 46px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
    .ref-slot.has-thumb .ref-thumb { display: block; }
    .ref-thumb img { width: 100%; height: 100%; object-fit: cover; background: var(--panel-2); cursor: zoom-in; }
    .ref-thumb .ref-clear { position: absolute; top: 2px; right: 2px; z-index: 2; box-sizing: border-box; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.55); font-size: 12px; line-height: 15px; text-align: center; cursor: pointer; padding: 0; }
    .ref-lightbox { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.82); align-items: center; justify-content: center; cursor: zoom-out; padding: 24px; }
    .ref-lightbox.show { display: flex; }
    .ref-lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; border-radius: 10px; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
    .cmd-input { flex: 1 1 auto; min-width: 0; border: none; outline: none; background: transparent; resize: none; font: inherit; font-size: 15px; color: var(--text); line-height: 1.4; max-height: 120px; padding: 12px 4px; }
    .cmd-input::placeholder { color: #b6b6b0; }
    .send-fab { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer; background: var(--accent); color: #fff; font-size: 0; display: inline-flex; align-items: center; justify-content: center; }
    .send-fab::before { content: "\2191"; font-size: 20px; font-weight: 700; line-height: 1; }
    .send-fab:hover { filter: brightness(1.05); }
    .send-fab:disabled, .send-fab.busy { opacity: .5; cursor: not-allowed; }
    .send-fab.busy::before { content: "\22EF"; }
    .latency-row { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; margin: 8px 6px 0; font-size: 12px; color: var(--muted); }
    .latency-row #netReadout, .latency-row #dispLatency, .latency-row #fpsReadout { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .cmd-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin: 8px 6px 0; font-size: 12px; color: var(--muted); }
    .cmd-foot .res-readout { white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .cmd-foot .pe-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; }
    .seg button { margin: 0; padding: 3px 12px; font-size: 12px; font-weight: 600; color: #6a6a64; background: transparent; border: none; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
    .seg button:hover { color: var(--accent); }
    .seg button.on { color: #fff; background: var(--accent); }
    .cmd-foot .steps-field { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .cmd-foot .steps-field input { width: 52px; margin: 0; padding: 3px 6px; font-size: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--text); }
    .cmd-foot .blend-field { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .cmd-foot .blend-field input[type=range] { width: 96px; margin: 0; accent-color: var(--accent); cursor: pointer; vertical-align: middle; }
    .cmd-foot .blend-field .blend-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 30px; color: var(--text); }
    .cmd-foot .kvreset-field { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .cmd-foot .kvreset-field input { width: 64px; margin: 0; padding: 3px 6px; font-size: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--text); }
    .qtier { display: inline-flex; gap: 3px; }
    .qtier button { width: auto; margin: 0; padding: 2px 9px; font-size: 12px; font-weight: 600; color: #6a6a64; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .qtier button:hover { border-color: var(--accent); color: var(--accent); }
    .qtier button.on { color: #fff; background: var(--accent); border-color: var(--accent); }
    .qtier button.auto-active { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .cmd-foot .pe-toggle[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
    .cmd-foot .grow { flex: 1 1 auto; }
    .cmd-foot .send-hint { color: var(--accent); font-weight: 600; }
    .scene-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 4px 2px; }
    .scene-row .scene-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
    .pe-result { display: none; margin: 8px 6px 0; padding: 7px 10px; font-size: 12px; line-height: 1.5; color: var(--muted); background: rgba(120,160,200,0.08); border: 1px solid rgba(120,160,200,0.18); border-radius: 8px; white-space: pre-wrap; word-break: break-word; max-height: 6.5em; overflow-y: auto; }
    .pe-result .pe-result-label { color: var(--text); font-weight: 600; margin-right: 6px; }
    .chip { cursor: pointer; font-size: 13px; font-weight: 560; color: #45443f; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 15px; }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chip.chip-ref { background: linear-gradient(180deg,#fff5e0,#ffe9c2); border-color: #e3b761; color: #8a5a12; font-weight: 700; }
    .chip.chip-ref::before { content: "📎 "; }
    .chip.chip-ref:hover { border-color: var(--accent); color: #8a5a12; }
    .chip.chip-ref.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cards-pop { display: none; position: absolute; left: 14px; right: 14px; bottom: calc(100% + 8px); z-index: 20; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .cards-pop.open { display: block; }
    .cards-pop .pop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; max-height: 46vh; overflow: auto; }
    button.prompt-case { text-align: left; cursor: pointer; margin: 0; padding: 9px 11px; line-height: 1.35; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text); }
    button.prompt-case:hover { border-color: var(--accent); }
    button.prompt-case.has-ref { background: linear-gradient(180deg,#fffaf0,#fff3dd); border-color: #e3c98f; border-left: 3px solid var(--accent); }
    button.prompt-case.has-ref:hover { border-color: var(--accent); }
    .prompt-case .pc-title { display: block; font-size: 13px; font-weight: 700; }
    .prompt-case .pc-desc { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }
    .legacy-hidden { display: none !important; }
    #maxTemporalIdsWrap { display: none; }
    .metric { color: var(--muted); font-size: 11px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    .stats-grid .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
    .stats-grid .stat-label { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stats-grid .stat-value { font-size: 13px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.warn { color: var(--accent-2); }
    .stage-timings-wrap { flex: 0 0 auto; margin: 0 12px 12px; }
    .stage-timings-wrap .st-title { font-size: 11px; color: var(--muted); margin: 0 2px 6px; }
    #netReadout.net-warn { color: #e5343d; font-weight: 700; }
    @media (max-width: 1000px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .stage { grid-template-columns: 1fr; gap: 8px; padding: 4px 10px 8px; }
      .media-box { aspect-ratio: 9 / 16; margin: 0 8px 8px; }
    }
  </style>
</head>
<body>
<div class="topbar">
  <span class="brand-dot"></span>
  <span class="brand">JoyAI-Video-Edit</span>
  <span class="tagline" data-i18n="tagline">流式视频编辑体验</span>
  <span id="langToggle" class="lang-seg" role="group" aria-label="Language">
    <button type="button" data-lang="zh">中文</button>
    <button type="button" data-lang="en">EN</button>
  </span>
</div>
<div class="res-banner" id="resBanner" style="display:none"><span class="res-ico">⚠️</span><span id="resBannerText"></span></div>

<div class="stage">
  <div class="vpanel">
    <div class="vpanel-head">
      <span class="vp-title"><span class="ico">📷</span> <span data-i18n="src_title">原始画面</span></span>
      <span class="src-controls">
        <span id="sourceSeg" class="seg" role="tablist">
          <button id="segCamera" type="button" class="on" data-src="camera" data-i18n="seg_camera">摄像头</button>
          <button id="segMp4" type="button" data-src="mp4">MP4</button>
        </span>
        <input id="videoFile" type="file" accept="video/*" style="display:none" />
      </span>
    </div>
    <div class="media-box">
      <video id="camera" autoplay muted playsinline></video>
      <div id="cropMask" class="crop-mask"></div>
      <div id="cameraOverlay" class="overlay">
        <button id="startCameraBtn" type="button" class="start-btn" data-i18n="start_camera">📷 开启摄像头</button>
        <div class="hint" data-i18n="camera_hint">仅采集画面，不支持语音；指令请使用文字输入</div>
      </div>
    </div>
  </div>
  <div class="vpanel">
    <div class="vpanel-head">
      <span class="vp-title"><span class="ico">✨</span> <span data-i18n="out_title">编辑结果</span></span>
    </div>
    <div class="media-box">
      <img id="outputImg" alt="编辑输出" data-i18n-alt="output_img_alt" />
      <canvas id="outputCanvas" style="display:none"></canvas>
      <video id="outputResult" playsinline controls style="display:none; position:absolute; inset:0; z-index:4;"></video>
      <button id="downloadBubble" type="button" class="download-bubble" style="display:none" data-i18n="download_done">✨ 编辑完成 · 下载</button>
      <div id="outputIdleOverlay" class="overlay">
        <div class="idle-ico">✨</div>
        <div class="hint" data-i18n="wait_edit_cmd">等待编辑指令</div>
      </div>
      <div id="outputWaitOverlay" class="overlay wait-overlay" style="display:none">
        <div id="outputWaitIco" class="idle-ico">👤</div>
        <div id="outputWaitHint" class="hint" data-i18n="face_camera">请正对摄像头</div>
      </div>
      <div id="outputStartOverlay" class="overlay wait-overlay" style="display:none">
        <div class="idle-ico spin">⏳</div>
        <div id="outputStartHint" class="hint" data-i18n="busy_starting">正在启动</div>
      </div>
      <div id="outputToast" class="toast"></div>
    </div>
    <div id="stageTimingsPanel" class="stage-timings-wrap" style="display:none">
      <div class="st-title" data-i18n="prof_title">性能分析（各阶段耗时 · 开启会略降性能）</div>
      <div id="stageTimings" class="stats-grid"></div>
    </div>
  </div>
</div>

<div class="cmdbar">
  <div class="cmd-row">
    <div id="refSlot" class="ref-slot">
      <label id="refAdd" class="ref-add" for="refImage">＋</label>
      <div id="refThumb" class="ref-thumb">
        <img id="refThumbImg" alt="reference" />
        <button id="refClear" type="button" class="ref-clear">×</button>
      </div>
      <input id="refImage" type="file" accept="image/*" style="display:none" />
    </div>
    <textarea id="prompt" class="cmd-input" rows="1" placeholder="描述你想要的编辑效果" data-i18n-ph="prompt_ph"></textarea>
    <button id="send" class="send-fab"></button>
  </div>
  <div class="latency-row">
    <span id="netReadout" class="keep-min">-</span>
    <span id="dispLatency" class="keep-min">-</span>
    <span id="fpsReadout" class="keep-min">-</span>
    <span id="sendHint" class="send-hint keep-min"></span>
  </div>
  <div class="cmd-foot minimal">
    <label id="peToggle" class="pe-toggle keep-min"><input id="usePe" type="checkbox" checked style="width:auto" /> <span data-i18n="pe_toggle">提示词增强</span></label>
    <label id="gateToggle" class="pe-toggle keep-min"><input id="dbgGateEnabled" type="checkbox" checked style="width:auto" /> <span data-i18n="gate_toggle">人物在场检测</span></label>
    <label id="profToggle" class="pe-toggle keep-min"><input id="profileTimings" type="checkbox" style="width:auto" /> <span data-i18n="prof_toggle">性能分析</span></label>
    <span class="kvreset-field keep-min">
      <span data-i18n="upload_quality">上传清晰度</span>
      <span id="upqTier" class="qtier">
        <button type="button" data-upq="0.2" data-i18n="q_low">低</button>
        <button type="button" data-upq="0.4" data-i18n="q_mid">中</button>
        <button type="button" data-upq="0.6" class="on" data-i18n="q_high">高</button>
      </span>
    </span>
    <span class="kvreset-field keep-min">
      <span data-i18n="download_quality">下载清晰度</span>
      <span id="qtier" class="qtier">
        <button type="button" data-q="20" data-i18n="q_low">低</button>
        <button type="button" data-q="40" data-i18n="q_mid">中</button>
        <button type="button" data-q="60" data-i18n="q_high">高</button>
        <button type="button" data-q="auto" class="on" data-i18n="q_auto">自动</button>
      </span>
      <input id="downQualityUi" type="hidden" />
    </span>
    <span class="kvreset-field keep-min">
      <span data-i18n="frame_speed">送帧速度</span>
      <span id="fpsTier" class="qtier">
        <button type="button" data-fps="32">32</button>
        <button type="button" data-fps="30">30</button>
        <button type="button" data-fps="28">28</button>
        <button type="button" data-fps="24" class="on">24</button>
        <button type="button" data-fps="20">20</button>
        <button type="button" data-fps="16">16</button>
        <button type="button" data-fps="12">12</button>
        <button type="button" data-fps="8">8</button>
      </span>
    </span>
  </div>
  <div id="peResult" class="pe-result" style="display:none"></div>
  <div class="scene-row">
    <span class="scene-label" data-i18n="scene_label">例子：</span>
    <div id="sceneChips" style="display:contents"></div>
  </div>
  <div id="cardsPop" class="cards-pop"></div>
</div>

<div class="legacy-hidden">
  <div class="row">
    <div><input id="width" type="number" value="840" /></div>
    <div><input id="height" type="number" value="480" /></div>
  </div>
  <div class="row">
    <div><input id="cameraFps" type="number" value="24" min="1" max="60" /></div>
    <div><input id="fps" type="number" value="24" min="1" max="32" /></div>
  </div>
  <div class="row">
    <div><input id="quality" type="number" value="0.6" min="0.1" max="1" step="0.01" /></div>
  </div>
  <input id="steps" type="number" value="2" min="1" max="8" />
  <label><input id="smoothPlayback" type="checkbox" checked /> <span data-i18n="smooth_playback">平滑输出播放</span></label>
  <div id="playbackDelayWrap" class="row">

function cameraTargetFps() {
  return Math.max(1, Number(document.getElementById("cameraFps").value) || 24);
}

function sendTargetFps() {
  return Math.max(1, Number(document.getElementById("fps").value) || 8);
}

function outputPlaybackFps() {
  const configured = sendTargetFps();
  const measured = cameraMeasuredFps > 0.5 ? cameraMeasuredFps : (cameraTrackFps || configured);
  return Math.max(1, Math.min(configured, measured || configured));
}

function outputQueueLimitFrames() {
  return Math.max(4, Math.ceil(outputPlaybackFps() * maxOutputQueueDelayMs() / 1000));
}

function outputQueueTargetFrames() {
  return Math.max(2, Math.ceil(outputPlaybackFps() * targetOutputQueueDelayMs() / 1000));
}

function getCameraSettings() {
  const track = stream ? stream.getVideoTracks()[0] : null;
  return track ? track.getSettings() : {};
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[ch]));
}

function statCell(label, value, tone = "") {
  const cls = tone ? ` ${tone}` : "";
  return `<div class="stat"><div class="stat-label">${escapeHtml(label)}</div><div class="stat-value${cls}">${escapeHtml(value)}</div></div>`;
}

function renderStageTimings() {
  if (!sessionProfileTimings) return;
  const p = chunkProfileLast;
  if (!p || p.dit_denoise_s === undefined) return;
  const ms = (key) => {
    const v = Number(p[key]);
    return Number.isFinite(v) ? v * 1000 : null;
  };
  const cards = [];
  const push = (label, key, tone = "") => cards.push(statCell(label, fmt(ms(key), "ms"), tone));

  const _encQ = (typeof upEncoder !== "undefined" && upEncoder) ? (upEncoder.encodeQueueSize || 0) : 0;
  const _wsBuf = (ws && ws.readyState === WebSocket.OPEN) ? (ws.bufferedAmount || 0) : 0;
  cards.push(statCell(t("stage_enc_q"), String(_encQ), _encQ >= 3 ? "warn" : ""));
  cards.push(statCell(t("stage_ws_buf"), (_wsBuf / 1024).toFixed(0) + " KB", _wsBuf > 131072 ? "warn" : ""));
  const _recvQ = (typeof outputFrameQueue !== "undefined" && outputFrameQueue) ? outputFrameQueue.length : 0;
  cards.push(statCell(t("stage_recv_q"), _recvQ + " · " + (outCodecH264 ? "h264" : "mjpeg"), _recvQ >= 16 ? "warn" : ""));

  if (Number.isFinite(Number(p.jpeg_decode_ms))) {
    cards.push(statCell(t("stage_jpeg"), fmt(Number(p.jpeg_decode_ms), "ms")));
  }
  push(t("stage_pil"), "frames_to_tensor_s");
  push(t("stage_vae_enc"), "vae_encode_s");
  push(t("stage_dit"), "dit_denoise_s", "accent");
  push(t("stage_kv"), "kv_store_s");
  push(t("stage_vae_dec"), "vae_decode_s");
  push(t("stage_q_enc"), "q_wait_encode_s");
  push(t("stage_q_dit"), "q_wait_dit_s");
  push(t("stage_q_dec"), "q_wait_decode_s");
  push(t("stage_q_pseudo"), "q_wait_pseudo_s");
  push(t("stage_q_post"), "q_wait_postprocess_s");
  const wsSendMs = Number.isFinite(Number(p.ws_send_s)) ? ms("ws_send_s") : lastWsSendMs;
  const residenceMs = Number.isFinite(Number(p.server_residence_s)) ? ms("server_residence_s") : lastServerResidenceMs;
  cards.push(statCell(t("stage_ws"), fmt(wsSendMs, "ms")));
  cards.push(statCell(t("stage_total"), fmt(ms("total_server_chunk_s"), "ms"), "warn"));
  cards.push(statCell(t("stage_residence"), fmt(residenceMs, "ms"), "warn"));

  stageTimings.innerHTML = cards.join("");
}

    const _uc = upClamped || upDrainFactor < 1 || (upDropAt > 0 && Date.now() - upDropAt < 3000);

function updateRateMeters() {
  const now = performance.now();
  const elapsed = Math.max((now - meterStartedAt) / 1000, 0.001);
  sendActualFps = sentFramesWindow / elapsed;
  receiveActualFps = receivedFramesWindow / elapsed;
  editActualFps = displayedFramesWindow / elapsed;
  sentFramesWindow = 0;
  receivedFramesWindow = 0;
  displayedFramesWindow = 0;
  meterStartedAt = now;
  ensureOutputPlaybackTimer();
  updateMetrics();
}

function disposeItem(item) {
  if (!item) return;
  if (item.bmp) { try { item.bmp.close(); } catch (e) {} item.bmp = null; }
  if (item.url) { try { URL.revokeObjectURL(item.url); } catch (e) {} item.url = null; }
}

function displayOutputFrame(item) {  if (!item) return;
  if (item.meta && item.meta.t_capture_ms) lastShownCaptureMs = Number(item.meta.t_capture_ms);
  if (outputWaitingFace) {
    outputWaitingFace = false;

  }
  if (item.bmp) {

      outputCanvas.height = item.bmp.height;
    }
    outputCanvasCtx.drawImage(item.bmp, 0, 0);

  } else {

    pendingRevokeUrl = lastObjectUrl;
    lastObjectUrl = item.url;

      if (pendingRevokeUrl) { URL.revokeObjectURL(pendingRevokeUrl); pendingRevokeUrl = null; }
      outputImg.onload = outputImg.onerror = null;
    };
    outputImg.src = item.url;
  }
  displayedFrames += 1;
  displayedFramesWindow += 1;
  const meta = item.meta;
  if (meta) {
    const latency = Date.now() - Number(meta.t_capture_ms || Date.now());
    editLatencyLastMs = latency;
    serverChunkLastSec = Number(meta.server_elapsed || 0);
    chunkProfileLast = meta.profile || chunkProfileLast;
  } else {
  }
  updateMetrics();
}

function effectivePlaybackIntervalMs() {
  const base = Math.max(16, Math.round(1000 / outputPlaybackFps()));
  const q = outputFrameQueue.length;
  const target = outputQueueTargetFrames();
  if (q <= target) return base;
  const over = (q - target) / Math.max(1, target);
  const speed = Math.min(2, 1 + over);
  return Math.max(8, Math.round(base / speed));
}

function alignTargetMs() {
  return Math.min(2500, Math.max(200, alignMaxAgeMs + targetOutputQueueDelayMs()));
}

function pumpOutputFrame() {
  if (!smoothPlaybackEnabled()) return;
  const T = alignTargetMs();
  const now = Date.now();
  let shown = 0;
  while (outputFrameQueue.length > 0 && shown < 4) {
    const head = outputFrameQueue[0];
    const tcap = head.meta && Number(head.meta.t_capture_ms);
    if (tcap && (now - tcap) < T) break;
    displayOutputFrame(outputFrameQueue.shift());
    shown++;
  }
  ensureOutputPlaybackTimer();
}

function ensureOutputPlaybackTimer(force = false) {
  if (!smoothPlaybackEnabled()) {
    if (outputPlaybackTimer) clearInterval(outputPlaybackTimer);
    outputPlaybackTimer = null;
    outputPlaybackIntervalMs = null;
    return;
  }
  const intervalMs = effectivePlaybackIntervalMs();
  if (!force && outputPlaybackTimer && outputPlaybackIntervalMs === intervalMs) return;
  if (outputPlaybackTimer) clearInterval(outputPlaybackTimer);
  outputPlaybackIntervalMs = intervalMs;
  outputPlaybackTimer = setInterval(pumpOutputFrame, intervalMs);
}

function clearOutputQueue() {
  for (const item of outputFrameQueue) disposeItem(item);
  outputFrameQueue = [];
}

function trimOutputQueueForLatency() {
  const limitFrames = outputQueueLimitFrames();
  if (outputFrameQueue.length <= limitFrames) return;
  const targetFrames = outputQueueTargetFrames();
  while (outputFrameQueue.length > targetFrames) {
    const dropped = outputFrameQueue.shift();
    disposeItem(dropped);
    outputQueueDroppedFrames += 1;
  }
}

let h264DecodeOk = false;
if (typeof VideoDecoder !== "undefined") {
  VideoDecoder.isConfigSupported({ codec: "avc1.640028", optimizeForLatency: true })
    .then((s) => { h264DecodeOk = !!(s && s.supported); })
    .catch(() => {});
}
let outCodecH264 = false;
let outDecoder = null;
let outDecSeq = 0;
const outMetaByTs = new Map();

let upCodecH264 = false;
let upEncoder = null;
const UPLINK_KEYFRAME_INTERVAL = 8;
let upSeq = 0;
const upPendingByTs = new Map();

const UP_CLAMP_Q = 0.2;

function effectiveUpQuality() {
  const q = Number(document.getElementById("quality").value) || 0.4;
  return upClamped ? Math.min(q, UP_CLAMP_Q) : q;
}

function upEncoderBitrate(width, height) {
  const REF_PX = 1248 * 720;
  const REF_BITRATE = (effectiveUpQuality() || 0.4) * 4000000 * upDrainFactor;
  const REF_FPS = 16;
  return Math.round(REF_BITRATE * (width * height / REF_PX) * Math.sqrt(sendTargetFps() / REF_FPS));
}

function uplinkCongestionTick() {
  if (!(ws && ws.readyState === WebSocket.OPEN && sessionGranted)) return;
  if (usingVideoFile) return;
  const buf = ws.bufferedAmount || 0;
  const upLow = upDelayHist.length
    ? Math.min.apply(null, upDelayHist.slice(-3))
    : null;
  const congested = (upLow !== null && upLow > 350) || buf > 262144;
  if (!upClamped) {
    if (congested && effectiveUpQuality() > UP_CLAMP_Q + 0.001) {
      upClamped = true;
      upClearStreak = 0;
      upClearNeed = Math.min(60, upClearNeed * 2);
      try { resetUplinkEncoder(); } catch (e) {}
      updateMetrics();
    }
  } else {
    const clear = (upLow === null || upLow < 120) && buf < 65536;
    upClearStreak = clear ? upClearStreak + 1 : 0;
    if (upClearStreak >= upClearNeed) {
      upClamped = false;
      upClearStreak = 0;
      try { resetUplinkEncoder(); } catch (e) {}
      updateMetrics();
    }
  }
  if (upLow !== null && upLow > 600) {
    upDrainClear = 0;
    upDrainHigh += 1;
    if (upDrainHigh >= 3 && upDrainFactor > 0.25) {
      upDrainFactor /= 2;
      upDrainHigh = 0;
      try { resetUplinkEncoder(); } catch (e) {}
      updateMetrics();
    }
  } else if ((upLow === null || upLow < 200) && buf < 65536) {
    upDrainHigh = 0;
    if (upDrainFactor < 1) {
      upDrainClear += 1;
      if (upDrainClear >= upDrainNeed) {
        upDrainFactor = Math.min(1, upDrainFactor * 2);
        upDrainClear = 0;
        upDrainNeed = Math.min(15, upDrainNeed * 2);
        try { resetUplinkEncoder(); } catch (e) {}
        updateMetrics();
      }
    }
  } else {
    upDrainHigh = 0;
    upDrainClear = 0;
  }
}

function upEncoderConfig(width, height) {
  return {
    codec: "avc1.42E028",
    width,
    height,
    bitrate: upEncoderBitrate(width, height),
    framerate: sendTargetFps(),
    latencyMode: "realtime",
    avc: { format: "annexb" },
  };
}

function resetUplinkEncoder() {
  if (upEncoder && upEncoder.state !== "closed") {
    try { upEncoder.close(); } catch (e) {}
  }
  upEncoder = null;
  upSeq = 0;
  upPendingByTs.clear();
}

function ensureUplinkEncoder(width, height) {
  if (upEncoder && upEncoder.state === "configured") return;
  upEncoder = new VideoEncoder({
    output: (chunk) => {
      const info = upPendingByTs.get(chunk.timestamp);
      upPendingByTs.delete(chunk.timestamp);
      if (!info || !ws || ws.readyState !== WebSocket.OPEN) return;
      if ((ws.bufferedAmount || 0) > 786432) {
        upDropTotal += 1;
        upDropAt = Date.now();
        upResumeKeyframe = true;
        return;
      }
      const buf = new ArrayBuffer(chunk.byteLength);
      chunk.copyTo(buf);
      try {
        ws.send(JSON.stringify({ type: "frame_meta", seq: info.seq, t_capture_ms: info.t_capture_ms }));
        ws.send(buf);
      } catch (e) {
        return;
      }
      sentFrames += 1;
      sentFramesWindow += 1;
      updateMetrics();
    },
    error: (e) => { console.error("VideoEncoder", e); },
  });
  upEncoder.configure(upEncoderConfig(width, height));
}

function encodeUplinkFrame(width, height) {
  upSkipCounter += 1;
  const _mod = upDrainFactor <= 0.25 ? 3 : (upDrainFactor <= 0.5 ? 2 : 1);
  if (_mod > 1 && (upSkipCounter % _mod) !== 0) return;
  drawCaptureFrame(width, height);
  ensureUplinkEncoder(width, height);
  const seq = ++upSeq;
  upPendingByTs.set(seq, { seq, t_capture_ms: Date.now() });
  let forceKey = false;
  if (upResumeKeyframe && ws && (ws.bufferedAmount || 0) < 131072) {
    forceKey = true;
    upResumeKeyframe = false;
  }
  const vf = new VideoFrame(capture, { timestamp: seq });
  upEncoder.encode(vf, { keyFrame: forceKey || seq === 1 || seq % UPLINK_KEYFRAME_INTERVAL === 0 });
  vf.close();
}

function resetOutputDecoder() {
  if (outDecoder && outDecoder.state !== "closed") {
    try { outDecoder.close(); } catch (e) {}
  }
  outDecoder = null;
  outDecSeq = 0;
  outMetaByTs.clear();
}

function feedOutputH264(buf, meta) {
  if (!outDecoder || outDecoder.state === "closed") {
    outDecoder = new VideoDecoder({
      output: (frame) => {
        const m = outMetaByTs.get(frame.timestamp);
        outMetaByTs.delete(frame.timestamp);
        createImageBitmap(frame).then((bmp) => {
          frame.close();
          enqueueOutputFrame(bmp, m);
        }, () => { frame.close(); });
      },
      error: (e) => { console.error("VideoDecoder", e); },
    });
    outDecoder.configure({ codec: "avc1.640028", optimizeForLatency: true });
    outDecSeq = 0;
    outMetaByTs.clear();
  }
  const key = !!(meta && meta.key);
  if (outDecSeq === 0 && !key) return;
  const ts = ++outDecSeq;
  if (meta) outMetaByTs.set(ts, meta);
  outDecoder.decode(new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp: ts, data: buf }));
}

function enqueueOutputFrame(frame, meta) {
  const item = frame instanceof ImageBitmap
    ? { bmp: frame, meta, receivedAtMs: Date.now() }
    : { url: URL.createObjectURL(frame), meta, receivedAtMs: Date.now() };
  if (!smoothPlaybackEnabled()) {
    displayOutputFrame(item);
    return;
  }
  const tc = Number(item.meta && item.meta.t_capture_ms) || 0;
  if (tc && tc <= lastShownCaptureMs) {
    disposeItem(item); outputQueueDroppedFrames += 1;
    return;
  }
  if (meta && meta.t_capture_ms && !(meta.profile && meta.profile.passthrough)) {
    const age = Date.now() - Number(meta.t_capture_ms);
    if (age > 0 && age < 5000) alignMaxAgeMs = Math.max(age, alignMaxAgeMs * 0.99);
  }
  outputFrameQueue.push(item);
  if (tc) {
    let i = outputFrameQueue.length - 1;
    while (i > 0 && (Number(outputFrameQueue[i - 1].meta && outputFrameQueue[i - 1].meta.t_capture_ms) || 0) > tc) {
      outputFrameQueue[i] = outputFrameQueue[i - 1];
      i--;
    }
    outputFrameQueue[i] = item;
  }
  while (outputFrameQueue.length > (outCodecH264 ? 32 : 120)) {
    const dropped = outputFrameQueue.shift();
    if (dropped) { disposeItem(dropped); outputQueueDroppedFrames += 1; }
  }
  ensureOutputPlaybackTimer();
  updateMetrics();
}

function flushOutputQueueToLatest() {
  while (outputFrameQueue.length > 1) {
    const dropped = outputFrameQueue.shift();
    disposeItem(dropped);
    outputQueueDroppedFrames += 1;
  }
  if (outputFrameQueue.length === 1) displayOutputFrame(outputFrameQueue.shift());
}

function measureCameraFrame(now) {
  cameraMeasuredFrames += 1;
  const elapsed = Math.max((now - cameraMeasureStartedAt) / 1000, 0.001);
  if (elapsed >= 1) {
    cameraMeasuredFps = cameraMeasuredFrames / elapsed;
    cameraMeasuredFrames = 0;
    cameraMeasureStartedAt = now;
    updateMetrics();
  }
  if (camera.requestVideoFrameCallback) {
    camera.requestVideoFrameCallback(measureCameraFrame);
  }
}

function measureCameraFallback() {
  if (!camera.getVideoPlaybackQuality) return;
  const quality = camera.getVideoPlaybackQuality();
  if (!quality || quality.totalVideoFrames === undefined) return;
  if (lastVideoQualityFrames === null) {
    lastVideoQualityFrames = quality.totalVideoFrames;
    return;
  }
  cameraMeasuredFps = Math.max(0, quality.totalVideoFrames - lastVideoQualityFrames);
  lastVideoQualityFrames = quality.totalVideoFrames;
  updateMetrics();
}

setInterval(updateRateMeters, 1000);
setInterval(measureCameraFallback, 1000);
updateMetrics();

async function ensureCamera() {
  if (usingVideoFile) {
    cameraTrackFps = null;
    updateMetrics();
    return;
  }
  if (stream) {
    const settings = getCameraSettings();
    cameraTrackFps = settings.frameRate || null;
    updateMetrics();
    return;
  }
  if (window.isSecureContext === false) {
    throw new Error("Camera access requires HTTPS or localhost; public HTTP origins cannot use getUserMedia.");
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("navigator.mediaDevices.getUserMedia is unavailable");
  }
  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      frameRate: { ideal: cameraTargetFps(), max: Math.max(cameraTargetFps(), 24) }
    },
    audio: false
  });
  camera.muted = true;
  camera.playsInline = true;
  camera.srcObject = stream;
  await new Promise((resolve) => {
    if (camera.readyState >= 2) resolve();
    else camera.onloadedmetadata = resolve;
    setTimeout(resolve, 2000);
  });
  await camera.play();
  const settings = getCameraSettings();
  cameraTrackFps = settings.frameRate || null;
  const camVW = camera.videoWidth || 0;
  const camVH = camera.videoHeight || 0;
  if (camVW && camVH) {
    const want = camVH > camVW ? "portrait" : "landscape";
    if (currentOrientation() !== want) applyOrientation(want);
  }
  updateMetrics();
  updateCropMask();
  if (camera.requestVideoFrameCallback) {
    camera.requestVideoFrameCallback(measureCameraFrame);
  }
}

function drawCaptureFrame(width, height) {
  capture.width = width;
  capture.height = height;
  const ctx = capture.getContext("2d");
  const selfieMirror = !usingVideoFile;
  ctx.save();
  if (selfieMirror) {
    ctx.translate(width, 0);
    ctx.scale(-1, 1);
  }
  const sw = camera.videoWidth || width;
  const sh = camera.videoHeight || height;
  const dstAr = width / height;
  const srcAr = sw / sh;
  let sx, sy, cropW, cropH;
  if (srcAr > dstAr) {
    cropH = sh;
    cropW = Math.round(sh * dstAr);
    sx = Math.round((sw - cropW) / 2);
    sy = 0;
  } else {
    cropW = sw;
    cropH = Math.round(sw / dstAr);
    sx = 0;
    sy = Math.round((sh - cropH) / 2);
  }
  ctx.drawImage(camera, sx, sy, cropW, cropH, 0, 0, width, height);
  ctx.restore();
}

function frameBlob(width, height, quality) {
  drawCaptureFrame(width, height);
  return new Promise(resolve => capture.toBlob(resolve, "image/jpeg", quality));
}

async function tick() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (pePausedSend) return;
  if (tickInFlight) {
    sendRealtimeSkips += 1;
    updateMetrics();
    return;
  }
  tickInFlight = true;
  try {
    if (backendPendingFrames() >= MAX_BACKEND_PENDING_FRAMES) {
      sendRealtimeSkips += 1;
      updateMetrics();
      return;
    }
    const width = Number(document.getElementById("width").value);
    const height = Number(document.getElementById("height").value);
    const quality = Number(document.getElementById("quality").value);
    if (upCodecH264) {
      encodeUplinkFrame(width, height);
      updateMetrics();
      return;
    }
    const blob = await frameBlob(width, height, quality);
    if (!blob || ws.readyState !== WebSocket.OPEN) return;
    const seq = sentFrames + 1;
    const tCaptureMs = Date.now();
    try {
      ws.send(JSON.stringify({ type: "frame_meta", seq, t_capture_ms: tCaptureMs }));
      if (ws.readyState !== WebSocket.OPEN) return;
      ws.send(blob);
    } catch (err) {
      return;
    }
    sentFrames += 1;
    sentFramesWindow += 1;
    updateMetrics();
  } finally {
    tickInFlight = false;
  }
}

function seekVideoTo(timeSec) {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => { if (done) return; done = true; camera.removeEventListener("seeked", finish); resolve(); };
    camera.addEventListener("seeked", finish, { once: true });
    try { camera.currentTime = timeSec; } catch (err) { finish(); }
    setTimeout(finish, 400);
  });
}
async function sendCurrentVideoFrame(mediaTimeSec) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return false;
  const width = Number(document.getElementById("width").value);
  const height = Number(document.getElementById("height").value);
  const quality = Number(document.getElementById("quality").value);
  const blob = await frameBlob(width, height, quality);
  if (!blob || ws.readyState !== WebSocket.OPEN) return false;
  const seq = sentFrames + 1;
  const tCaptureMs = Math.round(mediaTimeSec * 1000);
  try {
    ws.send(JSON.stringify({ type: "frame_meta", seq, t_capture_ms: tCaptureMs }));
    if (ws.readyState !== WebSocket.OPEN) return false;
    ws.send(blob);
  } catch (err) {
    return false;
  }
  sentFrames += 1;
  sentFramesWindow += 1;
  updateMetrics();
  return true;
}
async function pullNextVideoFrame() {
  if (!videoPullActive) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) { videoPullActive = false; return; }
  if (pePausedSend) return;
  if (videoPullIdx >= videoPullTotal) {
    videoPullActive = false;
    handleVideoEnded();
    return;
  }
  const frameStartMs = Date.now();
  const intervalMs = 1000 / Math.max(1, videoPullFps);
  if (backendPendingFrames() >= MAX_BACKEND_PENDING_FRAMES) {
    setTimeout(() => { pullNextVideoFrame(); }, 30);
    return;
  }
  const t = videoPullIdx / videoPullFps;
  await seekVideoTo(t);
  if (!videoPullActive || pePausedSend) return;
  const ok = await sendCurrentVideoFrame(t);
  if (!videoPullActive) return;
  if (ok) videoPullIdx += 1;
  const spent = Date.now() - frameStartMs;
  const wait = ok ? Math.max(0, intervalMs - spent) : 30;
  setTimeout(() => { pullNextVideoFrame(); }, wait);
}
function startVideoPull() {
  const dur = (Number.isFinite(camera.duration) && camera.duration > 0) ? camera.duration : 0;
  videoPullTotal = dur > 0 ? Math.max(1, Math.ceil(dur * videoPullFps)) : Number.MAX_SAFE_INTEGER;
  videoPullIdx = 0;
  videoPullActive = true;
  pullNextVideoFrame();
}
function stopVideoPull() { videoPullActive = false; }

async function start() {
  startingRun = true;
  setSendBusy(true, t("busy_starting"));
  showOutputStart(true, t("busy_starting"));
  try {
    await ensureCamera();
  } catch (err) {
    startingRun = false;
    setSendBusy(false, t("busy_camera_err"));
    return;
  }
  const protocol = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${protocol}://${location.host}/ws`);
  ws = socket;
  socket.binaryType = "arraybuffer";
  socket.onopen = async () => {
  };
  socket.onmessage = async (event) => {
    if (typeof event.data === "string") {
      const msg = JSON.parse(event.data);
      noteBackendAck(msg);
      if (msg.type === "queue_position") {
        const ahead = Number(msg.ahead != null ? msg.ahead : msg.position) || 0;
        setSendBusy(true, t("busy_queue") + ahead);
        return;
      }
      if (msg.type === "session_granted") {
        sessionGranted = true;
        setSendBusy(true, t("busy_starting"));
        showOutputStart(true, t("busy_starting"));
        beginSession();
        return;
      }
      if (msg.type === "started") {
        if (Number(msg.width) > 0 && Number(msg.height) > 0) {
          document.getElementById("width").value = msg.width;
          document.getElementById("height").value = msg.height;
          updateCropMask();
          updateResBanner();
        }
        outCodecH264 = msg.output_codec === "h264";
        resetOutputDecoder();
        outputImg.style.display = outCodecH264 ? "none" : "";
        outputCanvas.style.display = outCodecH264 ? "" : "none";
        upCodecH264 = msg.input_codec === "h264";
        resetUplinkEncoder();
        if (usingVideoFile) {
          try { camera.pause(); } catch (err) {}
          try { camera.currentTime = 0; } catch (err) {}
        }
        startingRun = false;
        pePausedSend = false;
        setSendBusy(false, t("busy_running"));
        outputWaitingFace = false;
        waitHintReason = null;

        if (outputWaitOverlay) outputWaitOverlay.style.display = "none";
        showOutputIdle(false);
        if (usingVideoFile && peDeferThisSend) {
          ensureOutputPlaybackTimer(true);
          startNetPingTimer();
          await seekVideoTo(0);
          await sendCurrentVideoFrame(0);
        } else {
          startFrameTimer();
        }
        if (usingVideoFile) updateUploadProgress();
        return;
      }
      if (msg.type === "pong") {
        const t = Number(msg.t);
        if (Number.isFinite(t)) {
          netRttLastMs = Math.max(0, Date.now() - t);
        }
        const up = Number(msg.up_ms);
        upDelayMs = Number.isFinite(up) ? up : null;
        if (upDelayMs !== null) {
          upDelayHist.push(upDelayMs);
          if (upDelayHist.length > 4) upDelayHist.shift();
        }
        const ts = Number(msg.ts);
        if (Number.isFinite(ts)) {
          let skew = Date.now() - ts;
          if (downSkewMin !== null) downSkewMin += 0.5 * Math.max(0, Date.now() - downSkewAt) / 1000;
          if (downSkewMin === null || skew < downSkewMin) downSkewMin = skew;
          downSkewAt = Date.now();
          downDelayMs = Math.max(0, skew - downSkewMin);
        }
        uplinkCongestionTick();
        updateMetrics();
        return;
      }
      if (msg.type === "flow_drop") {
        flowDropTotal = Number(msg.dropped_total) || (flowDropTotal + 1);
        flowDropAt = Date.now();
        updateMetrics();
        return;
      }
      if (msg.type === "output_frame") {
        pendingOutputMeta = msg;
        return;
      }
      if (msg.type === "recording_finalized") {
        onRecordingFinalized(msg);
        return;
      }
      if (msg.type === "prompt_enhanced") {
        if (peWatchdog) { clearTimeout(peWatchdog); peWatchdog = null; }
        pePausedSend = false;
        clearOutputQueue();
        lastShownCaptureMs = Date.now();
        alignMaxAgeMs = 0;
        if (usingVideoFile) {
          try { camera.pause(); } catch (err) {}
          startVideoPull();
        }
        const elapsed = Number(msg.elapsed_s || 0);
        const fallback = msg.fallback ? t("pe_fallback") : "";
        const error = msg.error ? t("pe_error") : "";
        const enhanced = msg.enhanced_prompt || msg.raw_prompt || "";
        showPeResult(msg.error ? "" : enhanced);
        if (pendingPeCacheKey && msg.enhanced_prompt && !msg.error) {
          peCache = { key: pendingPeCacheKey, enhanced_prompt: msg.enhanced_prompt, raw_prompt: msg.raw_prompt || "", model: msg.model || "" };
        }
        return;
      }
      if (msg.type === "session_reset") {
        clearOutputQueue();
        pendingOutputMeta = null;
        serverChunkLastSec = null;
        chunkProfileLast = null;
        lastWsSendMs = null;
        lastServerResidenceMs = null;
        const resetMsg = {
          person_count_changed: t("reset_count_changed"),
          person_returned:      t("reset_person_returned"),
          kv_reset_frames:      t("reset_kv"),
        }[msg.reason];
        if (resetMsg) {
          if (msg.reason === "person_count_changed") {
            showOutputToast(resetMsg);
          }
        } else {
        }
        updateMetrics();
        return;
      }
      if (msg.type === "accepted") {
        updateMetrics();
        return;
      }
      if (msg.type === "no_person") {
        outputWaitingFace = true;
        clearOutputQueue();
        pendingOutputMeta = null;
        if (outputIdleOverlay) outputIdleOverlay.style.display = "none";
        if (outputWaitOverlay) outputWaitOverlay.style.display = "";
        const _noFace = (msg.reason === "no_face");
        if (outputWaitIco) outputWaitIco.textContent = _noFace ? "🙈" : "🚫";
        const _hint = _noFace ? t("hint_no_face") : t("hint_no_person");
        if (outputWaitHint) outputWaitHint.textContent = _hint;
        waitHintReason = msg.reason || "no_person"; waitHintAt = Date.now();
        return;
      }
      if (msg.type === "waiting_face") {
        outputWaitingFace = true;
        if (outputIdleOverlay) outputIdleOverlay.style.display = "none";
        if (outputWaitOverlay) outputWaitOverlay.style.display = "";
        const R = msg.reason || "no_face";
        const now = Date.now();
        if (waitHintReason === null || (R !== waitHintReason && now - waitHintAt >= WAIT_HINT_MIN_MS)) {
          const map = {
            too_close:  { ico: "👕", hint: t("gate_too_close") },
            too_small:  { ico: "🔍", hint: t("gate_too_small") },
            face_cut:   { ico: "🙂", hint: t("gate_face_cut") },
            off_center: { ico: "🎯", hint: t("gate_off_center") },
            settling:   { ico: "✋", hint: t("gate_settling") },
            no_face:    { ico: "👤", hint: t("gate_no_face_wait") },
          };
          const m = map[R] || map.no_face;
          if (outputWaitIco) outputWaitIco.textContent = m.ico;
          if (outputWaitHint) outputWaitHint.textContent = m.hint;
          waitHintReason = R; waitHintAt = now;
        }
        return;
      }
      if (msg.type === "pe_running") {
        pePausedSend = true;
        if (usingVideoFile) { try { camera.pause(); } catch (err) {} }
        outputWaitingFace = true;
        if (outputIdleOverlay) outputIdleOverlay.style.display = "none";
        if (outputWaitOverlay) outputWaitOverlay.style.display = "";
        if (outputWaitIco) outputWaitIco.textContent = "✨";
        if (outputWaitHint) outputWaitHint.textContent = t("pe_running");
        waitHintReason = "pe_running"; waitHintAt = Date.now();
        if (peWatchdog) clearTimeout(peWatchdog);
        peWatchdog = setTimeout(() => {
          peWatchdog = null;
          if (!pePausedSend) return;
          pePausedSend = false;
          if (usingVideoFile) {
            try { camera.pause(); } catch (err) {}
            startVideoPull();
          }
        }, 30000);
        return;
      }
      if (msg.type === "chunk_done") {
        try { ws.send(JSON.stringify({ type: "ack", recv: receivedFrames })); } catch (err) {}
        if (
          chunkProfileLast &&
          (msg.ws_send_s !== undefined || msg.server_residence_s !== undefined) &&
          (msg.chunk_idx === undefined || chunkProfileLast.chunk_idx === msg.chunk_idx)
        ) {
          if (msg.ws_send_s !== undefined) chunkProfileLast.ws_send_s = msg.ws_send_s;
          if (msg.server_residence_s !== undefined) chunkProfileLast.server_residence_s = msg.server_residence_s;
          if (msg.ws_send_s !== undefined && Number.isFinite(Number(msg.ws_send_s))) lastWsSendMs = Number(msg.ws_send_s) * 1000;
          if (msg.server_residence_s !== undefined && Number.isFinite(Number(msg.server_residence_s))) lastServerResidenceMs = Number(msg.server_residence_s) * 1000;
          updateMetrics();
        }
        return;
      }
      if (msg.type === "session_timeout") {
        stopVideoPull();
        stopRecordDrain();
        sessionGranted = false;
        setSendBusy(false, t("busy_released"));
        return;
      }
      return;
    }
    if (startingRun) return;
    const meta = pendingOutputMeta;
    pendingOutputMeta = null;
    receivedFrames += 1;
    if (receivedFrames % 4 === 0) {
      try { ws.send(JSON.stringify({ type: "ack", recv: receivedFrames })); } catch (err) {}
    }
    receivedFramesWindow += 1;
    if (meta) {
      const latency = Date.now() - Number(meta.t_capture_ms || Date.now());
      editReceiveLatencyLastMs = latency;
      serverChunkLastSec = Number(meta.server_elapsed || 0);
      chunkProfileLast = meta.profile || chunkProfileLast;
      updateMetrics();
    }
    if (outCodecH264) {
      feedOutputH264(event.data, meta);
      return;
    }
    enqueueOutputFrame(new Blob([event.data]), meta);
  };
  socket.onclose = () => {
    if (ws !== socket) return;
    if (timer) clearInterval(timer);
    timer = null;
    stopVideoPull();
    resetOutputDecoder();
    resetUplinkEncoder();
    if (netPingTimer) clearInterval(netPingTimer);
    netPingTimer = null;
    if (outputPlaybackTimer) clearInterval(outputPlaybackTimer);
    outputPlaybackTimer = null;
    outputPlaybackIntervalMs = null;
    clearOutputQueue();
    stopRecordDrain();
    if (peWatchdog) { clearTimeout(peWatchdog); peWatchdog = null; }
    finalizeIsForResult = false;
    resultEpoch += 1;
    ws = null;
    startingRun = false;
    sessionGranted = false;
    setSendBusy(false, t("busy_disconnected"));
    showOutputIdle(true);
    updateMetrics();
  };
  socket.onerror = () => {
    if (ws === socket) {
      startingRun = false;
      setSendBusy(false, t("busy_conn_err"));
    }
  };
}

function stopActiveRun() {
  if (timer) clearInterval(timer);
  timer = null;
  stopVideoPull();
  stopRecordDrain();
  try { if (usingVideoFile) camera.pause(); } catch (err) {}
  if (netPingTimer) clearInterval(netPingTimer);
  netPingTimer = null;
  if (outputPlaybackTimer) clearInterval(outputPlaybackTimer);
  outputPlaybackTimer = null;
  outputPlaybackIntervalMs = null;
  clearOutputQueue();
  const currentWs = ws;
  ws = null;
  if (currentWs) {
    try {
      if (currentWs.readyState === WebSocket.OPEN) currentWs.send(JSON.stringify({ type: "stop" }));
    } catch (err) {}
    currentWs.onopen = null;
    currentWs.onmessage = null;
    currentWs.onerror = null;
    currentWs.onclose = null;
    try { currentWs.close(); } catch (err) {}
  }
}

async function send() {
  if (startingRun) return;
  if (ws && ws.readyState === WebSocket.OPEN && sessionGranted) {
    startingRun = true;
    setSendBusy(true, t("busy_resetting"));
    if (timer) clearInterval(timer);
    timer = null;
    stopVideoPull();
    try { if (usingVideoFile) camera.pause(); } catch (err) {}
    clearResultVideo();
    clearOutputQueue();
    showOutputStart(true, t("busy_resetting"));
    const ok = await beginSession();
    if (ok) return;
    startingRun = false;
    sessionGranted = false;
  }
  stopActiveRun();
  await start();
}

function applyCaseSelection(item, group) {
  const promptEl = document.getElementById("prompt");
  promptEl.value = sceneField(item, "text");
  if (item.ref && REF_IMAGES && REF_IMAGES[item.ref]) {
    const el = document.getElementById("refImage");
    if (el) el.value = "";
    injectedRefImageDataUrl = REF_IMAGES[item.ref];
    refImagePreviewDataUrl = injectedRefImageDataUrl;
    applyRefImagePreview();
  } else if (!refImageSelected()) {
    injectedRefImageDataUrl = null;
    refImagePreviewDataUrl = null;
  }
  updateSourceFrameVisibility();
  syncRefThumb();
  closeCardsPop();
  updateMetrics();
  suppressPeThisSend = false;
  send();
}

function syncRefThumb() {
  if (!refSlot) return;
  const url = refImagePreviewDataUrl || injectedRefImageDataUrl || null;
  if (url) {
    if (refThumbImg) refThumbImg.src = url;
    refSlot.classList.add("has-thumb");
    refSlot.style.display = "";
  } else {
    if (refThumbImg) refThumbImg.removeAttribute("src");
    refSlot.classList.remove("has-thumb");
    refSlot.style.display = "";
  }
  syncPeAvailability();
}

function refImageActive() {
  return refImageSelected() || !!injectedRefImageDataUrl || !!refImagePreviewDataUrl;
}

function syncPeAvailability() {
  const usePeEl = document.getElementById("usePe");
  const peAvailable = !(SERVER_DEFAULTS && SERVER_DEFAULTS.pe_available === false);
  const locked = refImageActive() || !peAvailable;
  if (usePeEl) {
    usePeEl.disabled = locked;
    if (!peAvailable) usePeEl.checked = false;
  }
  if (peToggleEl) {
    peToggleEl.setAttribute("aria-disabled", locked ? "true" : "false");
  }
}

function openCategory(group, chipEl) {
  if (!cardsPop) return;
  if (activeChipKey === group.key) { closeCardsPop(); return; }
  activeChipKey = group.key;
  if (sceneChipsEl) {

  }

    const tEl = document.createElement("span");
    tEl.className = "pc-title";

    btn.appendChild(tEl);

function renderPromptCases() {

function handleVideoFileChange(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  stopActiveRun();
  camera.onended = null;
  camera.onloadedmetadata = null;
  startingRun = false;
  sessionGranted = false;
  setSendBusy(false, "");
  clearResultVideo();
  showCameraOverlay(false);
  blankOutputPane();
  showOutputIdle(true);
  if (stream) {
    for (const track of stream.getTracks()) { try { track.stop(); } catch (err) {} }
    stream = null;
  }
  if (videoFileUrl) { try { URL.revokeObjectURL(videoFileUrl); } catch (err) {} }
  videoFileUrl = URL.createObjectURL(file);
  usingVideoFile = true;
  camera.srcObject = null;
  camera.classList.add("no-mirror");
  camera.src = videoFileUrl;
  camera.loop = false;
  camera.muted = true;
  camera.playsInline = true;
  camera.onended = handleVideoEnded;
  camera.onloadedmetadata = () => {
    const vw = camera.videoWidth || 0;
    const vh = camera.videoHeight || 0;
    if (vw > 0 && vh > 0) {
      const want = vh > vw ? "portrait" : "landscape";
      if (currentOrientation() !== want) {
        applyOrientation(want);
      }
    }
  };
  setSourceSeg("mp4");
  if (cropMaskEl) cropMaskEl.classList.remove("show");
  camera.pause();
  try { camera.currentTime = 0; } catch (err) {}
  updateMetrics();
}

function handleVideoEnded() {
  if (!usingVideoFile) return;
  if (resultSyncActive) return;
  if (finalizeIsForResult) return;
  stopVideoPull();
  if (timer) { clearInterval(timer); timer = null; }
  if (netPingTimer) { clearInterval(netPingTimer); netPingTimer = null; }
  updateMetrics();
  if (ws && ws.readyState === WebSocket.OPEN && sessionGranted) {
    finalizeIsForResult = true;
    updateUploadProgress();
    if (finalizeWatchdog) clearTimeout(finalizeWatchdog);
    finalizeWatchdog = setTimeout(() => {
      finalizeWatchdog = null;
      if (!finalizeIsForResult) return;
      finalizeIsForResult = false;
      fetchAndShowResult();
    }, 30000);
    try { ws.send(JSON.stringify({ type: "finalize_recording" })); }
    catch (err) {}
  }
}

function switchToCamera() {
  stopActiveRun();
  startingRun = false;
  sessionGranted = false;
  setSendBusy(false, "");
  clearResultVideo();
  blankOutputPane();
  showOutputIdle(true);
  usingVideoFile = false;
  camera.classList.remove("no-mirror");
  if (videoFileUrl) { try { URL.revokeObjectURL(videoFileUrl); } catch (err) {} }
  videoFileUrl = null;
  camera.onended = null;
  camera.onloadedmetadata = null;
  camera.loop = false;
  camera.removeAttribute("src");
  camera.load();
  document.getElementById("videoFile").value = "";
  setSourceSeg("camera");
  applyOrientation(defaultCameraOrientation());
  camera.srcObject = null;
  ensureCamera().then(() => {
    showCameraOverlay(false);
  }).catch((err) => {
    showCameraOverlay(true);
  });
}

function startResultSync() {
  if (!outputResult) return;
  stopResultSync();
  resultSyncActive = true;
  camera.muted = true;
  camera.loop = false;
  outputResult.loop = false;
  const mirror = () => { try { camera.currentTime = outputResult.currentTime; } catch (e) {} };
  const onPlay = () => { camera.play().catch(() => {}); };
  const onPause = () => { try { camera.pause(); } catch (e) {} };
  const onRate = () => { camera.playbackRate = outputResult.playbackRate; };
  const onTimeUpdate = () => {
    if (Math.abs(camera.currentTime - outputResult.currentTime) > 0.15) mirror();
  };
  const onEnded = () => {
    try { camera.currentTime = 0; } catch (e) {}
    try { outputResult.currentTime = 0; } catch (e) {}
    camera.play().catch(() => {});
    outputResult.play().catch(() => {});
  };
  resultSyncHandlers = { onPlay, onPause, onRate, onTimeUpdate, onEnded, mirror };
  outputResult.addEventListener("play", onPlay);
  outputResult.addEventListener("pause", onPause);
  outputResult.addEventListener("ratechange", onRate);
  outputResult.addEventListener("seeking", mirror);
  outputResult.addEventListener("seeked", mirror);
  outputResult.addEventListener("timeupdate", onTimeUpdate);
  outputResult.addEventListener("ended", onEnded);
  try { camera.currentTime = 0; } catch (e) {}
  try { outputResult.currentTime = 0; } catch (e) {}
  camera.play().catch(() => {});
  outputResult.play().catch(() => {});
}
function stopResultSync() {
  resultSyncActive = false;
  if (resultSyncHandlers && outputResult) {
    const h = resultSyncHandlers;
    outputResult.removeEventListener("play", h.onPlay);
    outputResult.removeEventListener("pause", h.onPause);
    outputResult.removeEventListener("ratechange", h.onRate);
    outputResult.removeEventListener("seeking", h.mirror);
    outputResult.removeEventListener("seeked", h.mirror);
    outputResult.removeEventListener("timeupdate", h.onTimeUpdate);
    outputResult.removeEventListener("ended", h.onEnded);
  }
  resultSyncHandlers = null;
  try { if (usingVideoFile) camera.pause(); } catch (e) {}
}
function clearResultVideo() {
  stopResultSync();
  finalizeIsForResult = false;
  resultEpoch += 1;
  if (typeof showDownloadBubble === "function") showDownloadBubble(false);
  if (outputResult) {
    try { outputResult.pause(); } catch (e) {}
    outputResult.removeAttribute("src");
    outputResult.load();
    outputResult.style.display = "none";
  }
  if (resultBlobUrl) { try { URL.revokeObjectURL(resultBlobUrl); } catch (e) {} resultBlobUrl = null; }
}

async function fetchAndSaveRecording() {
  if (resultBlobUrl) {
    triggerBrowserDownload(resultBlobUrl, "joyomni_output.mp4");
    return;
  }
  try {
    const resp = await fetch("/download_last", { cache: "no-store" });
    if (!resp.ok) {
      let detail = "";
      try { const j = await resp.json(); detail = j.error || ""; } catch (e) {}
      return;
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    triggerBrowserDownload(url, "joyomni_output.mp4");
    setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 60000);
  } catch (err) {
  }
}
async function fetchAndShowResult() {
  const myEpoch = resultEpoch;
  try {
    const resp = await fetch("/download_last", { cache: "no-store" });
    if (myEpoch !== resultEpoch) return;
    if (!resp.ok) {
      let detail = "";
      try { const j = await resp.json(); detail = j.error || ""; } catch (e) {}
      setSendBusy(false, "");
      return;
    }
    const blob = await resp.blob();
    if (myEpoch !== resultEpoch) return;
    if (resultBlobUrl) { try { URL.revokeObjectURL(resultBlobUrl); } catch (e) {} }
    resultBlobUrl = URL.createObjectURL(blob);
    showResultVideo(resultBlobUrl);
    if (usingVideoFile) startResultSync();
    showDownloadBubble(true);
    showOutputToast(t("toast_done"), 4000);
    setSendBusy(false, "");
  } catch (err) {
  }
}
function onRecordingFinalized(msg) {
  if (finalizeWatchdog) { clearTimeout(finalizeWatchdog); finalizeWatchdog = null; }
  downloadPending = false;
  if (msg && msg.ok === false) {
    finalizeIsForResult = false;
    stopResultSync();
    if (outputWaitOverlay) outputWaitOverlay.style.display = "none";
    showOutputIdle(true);
    setSendBusy(false, "");
    return;
  }
  finalizeIsForResult = false;
  if (outputWaitOverlay) outputWaitOverlay.style.display = "";
  if (outputWaitIco) outputWaitIco.textContent = "✨";
  if (outputWaitHint) outputWaitHint.textContent = t("toast_finalizing");
  setSendBusy(true, t("toast_finalizing"));
  fetchAndShowResult();
}

document.getElementById("useMaxTemporalIds").addEventListener("change", () => {
  updateMaxTemporalIdsVisibility();
  updateMetrics();
});
for (const id of ["width", "height", "cameraFps", "fps", "quality", "steps", "usePe", "refImage", "smoothPlayback", "targetQueueDelayMs", "maxQueueDelayMs", "kvResetFrames", "useMaxTemporalIds", "maxTemporalIds", "freezeKvOnStatic", "staticDiffThresh", "profileTimings", "dbgGateEnabled"]) {
  document.getElementById(id).addEventListener("input", updateMetrics);
  document.getElementById(id).addEventListener("change", updateMetrics);
}
var upqTierEl = document.getElementById("upqTier");
const qualityLegacyEl = document.getElementById("quality");
function highlightUpqTier(v) {
  if (!upqTierEl) return;
  for (const b of upqTierEl.querySelectorAll("button")) {
    b.classList.toggle("on", Number(b.getAttribute("data-upq")) === Number(v));
  }
}
function syncUpQualityUi() {
  highlightUpqTier(qualityLegacyEl ? qualityLegacyEl.value : "0.6");
}
if (upqTierEl) {
  for (const b of upqTierEl.querySelectorAll("button")) {
    b.addEventListener("click", () => {
      const v = b.getAttribute("data-upq");
      if (qualityLegacyEl) qualityLegacyEl.value = v;
      highlightUpqTier(v);
      resetUplinkEncoder();
      updateMetrics();
    });
  }
}
const Q_TIERS = [20, 40, 60];
const downQualityUi = document.getElementById("downQualityUi");
const qtierEl = document.getElementById("qtier");
let autoQTier = 2;
let autoQLowStreak = 0;
let autoQHoldTicks = 0;
function sendOutputQuality(v) {
  if (ws && ws.readyState === WebSocket.OPEN && sessionGranted) {
    try { ws.send(JSON.stringify({ type: "set_output_quality", value: v })); } catch (err) {}
  }
}
function setDownQuality(v, opts) {
  const q = Math.max(1, Math.min(100, Math.floor(v)));
  if (downQualityUi) downQualityUi.value = String(q);
  if (opts && opts.live) sendOutputQuality(q);
  updateMetrics();
}
function highlightQTier(which) {
  if (!qtierEl) return;
  for (const b of qtierEl.querySelectorAll("button")) {
    b.classList.toggle("on", b.getAttribute("data-q") === String(which));
    b.classList.remove("auto-active");
  }
  if (which === "auto") {
    const cur = String(Q_TIERS[autoQTier]);
    for (const b of qtierEl.querySelectorAll("button")) {
      if (b.getAttribute("data-q") === cur) b.classList.add("auto-active");
    }
  }
}
if (qtierEl) {
  for (const b of qtierEl.querySelectorAll("button")) {
    b.addEventListener("click", () => {
      const d = b.getAttribute("data-q");
      if (d === "auto") {
        autoQuality = true; autoQTier = 2; autoQLowStreak = 0; autoQHoldTicks = 0;
        highlightQTier("auto");
        setDownQuality(Q_TIERS[autoQTier], { live: true });
      } else {
        autoQuality = false;
        highlightQTier(Number(d));
        setDownQuality(Number(d), { live: true });
      }
    });
  }
}
const fpsTierEl = document.getElementById("fpsTier");
const fpsInputEl = document.getElementById("fps");
if (fpsTierEl) {
  for (const b of fpsTierEl.querySelectorAll("button")) {
    b.addEventListener("click", () => {
      const v = b.getAttribute("data-fps");
      if (fpsInputEl) fpsInputEl.value = v;
      for (const x of fpsTierEl.querySelectorAll("button")) x.classList.toggle("on", x === b);
      if (timer) { clearInterval(timer); timer = setInterval(tick, Math.floor(1000 / sendTargetFps())); }
      updateMetrics();
    });
  }
}
function autoQualityTick() {
  if (!autoQuality) return;
  if (!(ws && ws.readyState === WebSocket.OPEN && sessionGranted)) return;
  const rtt = (downDelayMs !== null && downDelayMs !== undefined) ? downDelayMs : netRttLastMs;
  if (rtt === null || rtt === undefined) return;
  if (autoQHoldTicks > 0) autoQHoldTicks--;
  let target = autoQTier;
  if (rtt > 300) {
    if (autoQHoldTicks === 0) target = Math.max(1, autoQTier - 1);
    autoQLowStreak = 0;
  } else if (rtt < 150) {
    autoQLowStreak++;
    if (autoQLowStreak >= 5 && autoQHoldTicks === 0) { target = Math.min(2, autoQTier + 1); autoQLowStreak = 0; }
  } else {
    autoQLowStreak = 0;
  }
  if (target !== autoQTier) {
    autoQTier = target;
    autoQHoldTicks = 2;
    setDownQuality(Q_TIERS[autoQTier], { live: true });
    highlightQTier("auto");
  }
}
function faceGateDebugEnabled() {
  const el = document.getElementById("dbgGateEnabled");
  return !el || el.checked;
}
function applyServerDefaults() {
  const d = SERVER_DEFAULTS || {};
  const numMap = {
    width: "width", height: "height", steps: "num_inference_steps",
    fps: "fps",
    kvResetFrames: "kv_reset_frames", staticDiffThresh: "static_diff_thresh",
  };
  for (const [id, key] of Object.entries(numMap)) {
    const v = d[key];
    if (v !== null && v !== undefined) document.getElementById(id).value = v;
  }
  if (d.fps !== null && d.fps !== undefined) {
    const tier = document.getElementById("fpsTier");
    if (tier) for (const b of tier.querySelectorAll("button")) {
      b.classList.toggle("on", Number(b.getAttribute("data-fps")) === Number(d.fps));
    }
  }
  const boolMap = {
    freezeKvOnStatic: "freeze_kv_on_static",
    usePe: "use_pe",
    dbgGateEnabled: "online_gate",
    profileTimings: "profile_timings",
  };
  for (const [id, key] of Object.entries(boolMap)) {
    const v = d[key];
    if (v !== null && v !== undefined) document.getElementById(id).checked = !!v;
  }
  const maxIds = d.max_temporal_ids;
  if (maxIds !== null && maxIds !== undefined) {
    document.getElementById("useMaxTemporalIds").checked = true;
    document.getElementById("maxTemporalIds").value = maxIds;
  }
  if (d.output_quality !== undefined && d.output_quality !== "auto") {
    autoQuality = false;
    highlightQTier(Number(d.output_quality));
    setDownQuality(Number(d.output_quality), { live: false });
  } else {
    highlightQTier("auto");
    setDownQuality(Q_TIERS[autoQTier], { live: false });
  }
  if (typeof syncUpQualityUi === "function") syncUpQualityUi();
}

window.addEventListener("load", () => {
  applyServerDefaults();
  const langBtn = document.getElementById("langToggle");
  if (langBtn) {
    for (const b of langBtn.querySelectorAll("button")) {
      b.addEventListener("click", () => setLang(b.getAttribute("data-lang")));
    }
  }
  applyLang();
  applyOrientation(defaultCameraOrientation());
  updateMaxTemporalIdsVisibility();
  updateSourceFrameVisibility();
  syncRefThumb();
  showOutputIdle(true);
  updateMetrics();
  ensureCamera().then(() => {
    showCameraOverlay(false);
  }).catch((err) => {
    showCameraOverlay(true);
  });
});
</script>
</body>
</html>
